{% extends "base.html" %}
{% block title %}Analytics{% endblock %}
{% block content %}
<h3 class="mb-4">Examination statistics</h3>
<div class="row g-4">
  <div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
    <h6>Active bookings per examination</h6><canvas id="c1"></canvas></div></div></div>
  <div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
    <h6>Examiner workload</h6><canvas id="c2"></canvas></div></div></div>
  <div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
    <h6>Examination completion (by status)</h6><canvas id="c3"></canvas></div></div></div>
  <div class="col-md-6"><div class="card shadow-sm"><div class="card-body">
    <h6>Booking trend (bookings made per day)</h6><canvas id="c4"></canvas></div></div></div>
</div>

<script src="{{ url_for('static', filename='js/chart.umd.min.js') }}"></script>
<script>
  const data = {{ data|tojson }};
  const whole = { scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } };
  new Chart(document.getElementById('c1'), { type: 'bar',
    data: { labels: data.per_exam.labels, datasets: [{ label: 'Bookings', data: data.per_exam.values }] }, options: whole });
  new Chart(document.getElementById('c2'), { type: 'bar',
    data: { labels: data.workload.labels, datasets: [
      { label: 'Slots', data: data.workload.slots },
      { label: 'Students', data: data.workload.students }] }, options: whole });
  new Chart(document.getElementById('c3'), { type: 'doughnut',
    data: { labels: data.status.labels, datasets: [{ data: data.status.values }] } });
  new Chart(document.getElementById('c4'), { type: 'line',
    data: { labels: data.trend.labels, datasets: [{ label: 'Bookings', data: data.trend.values }] }, options: whole });
</script>
{% endblock %}
