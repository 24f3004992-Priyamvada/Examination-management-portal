{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="mb-3">My profile</h4>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input name="name" class="form-control" value="{{ request.form.get('name', current_user.name) }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email (cannot be changed)</label>
            <input class="form-control" value="{{ current_user.email }}" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">Roll number (cannot be changed)</label>
            <input class="form-control" value="{{ me.roll_no }}" disabled>
          </div>
          <div class="mb-3">
            <label class="form-label">Contact</label>
            <input name="contact" class="form-control" value="{{ request.form.get('contact', me.contact or '') }}">
          </div>
          <hr>
          <p class="text-muted small">Fill these two only if you want to change your password.</p>
          <div class="mb-3">
            <label class="form-label">Current password</label>
            <input type="password" name="current_password" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label">New password (min 6 characters)</label>
            <input type="password" name="new_password" class="form-control" minlength="6">
          </div>
          <button class="btn btn-primary">Save changes</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
